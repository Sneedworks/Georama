name: PR48 current-main Node 22 validation

on:
  push:
    branches: [ci/pr48-merge-preview-20261031]

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx vitest run tests/unit/core-wrapped-mask-paint.test.ts --maxWorkers=1 --no-file-parallelism
      - run: npm run typecheck
      - run: npm test -- --maxWorkers=1 --no-file-parallelism
      - run: npm run build
